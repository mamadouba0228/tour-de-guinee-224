<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour de Guinée 224 – Reportages</title>
<meta name="theme-color" content="#00804f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TDG 224">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Couleurs du drapeau guinéen : rouge #ce1126, jaune #fcd116, vert #009460.
   --brand est la couleur principale de l'application (bandeau, boutons) : le vert. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#141010);--panel:light-dark(#f6f3ee,#1f1a18);--line:light-dark(#e4ddd3,#3a312d);
--ink:light-dark(#1b1513,#f3ede8);--mute:light-dark(#6b605a,#b3a79f);
--brand:#00804f;--rouge:light-dark(#a50d1e,#e2394b);--yel:#fcd116;--grn:light-dark(#00804f,#2fbf82);--amb:light-dark(#9a6a00,#f0c14b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.btn{position:relative}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
header{background:var(--brand);color:#fff;padding:18px max(4vw,16px) 0;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#ce1126 0 33.3%,var(--yel) 0 66.6%,#009460 0)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:10px;background:var(--yel);color:var(--brand);display:grid;place-items:center;font:800 17px Archivo,Inter,sans-serif}
h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.sub{opacity:.9;font-size:14px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto;padding-bottom:5px;min-height:49px}
nav a{flex:none;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:600;font-size:15px;opacity:.85}
nav a.on{background:var(--bg);color:var(--grn);opacity:1}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
h2{font-size:clamp(22px,3vw,30px);font-weight:800;margin:6px 0 14px}
h3{font-size:18px;font-weight:600;margin:26px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:800 clamp(20px,2.6vw,28px) Archivo,Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{color:var(--mute);font-size:13px}
.kpi .l{font-size:14px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}
.colm{background:var(--panel);border-radius:14px;padding:10px;min-height:150px}
.colm h4{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.card:hover{border-color:var(--brand)}
.card strong{display:block;font-size:15px;line-height:1.25}
.card .m{color:var(--mute);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn)}
.p-av{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
.p-no{background:color-mix(in srgb,#ce1126 15%,transparent);color:var(--rouge)}
.p-wait{background:var(--panel);color:var(--mute);border:1px dashed var(--line)}
button,.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.pri,.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.dng{color:var(--rouge)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,.btn:focus-within{outline:3px solid var(--yel);outline-offset:2px}
input,select,textarea{font:16px Inter,sans-serif;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--panel);color:var(--ink);opacity:1}
textarea{min-height:80px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:start;font-size:13px;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
.bars .b{display:grid;grid-template-columns:9em minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 6px;font-size:14px;border-radius:8px}
.bars .b:hover{background:var(--panel)}
.bars .b .v{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mute)}
.bars .b:hover .v{color:var(--ink)}
.track{height:12px;background:var(--panel);border-radius:6px;overflow:hidden;display:flex;gap:2px}
.bars .b:hover .track{background:var(--bg)}
.track i{display:block;height:100%;border-radius:0 4px 4px 0}
.empty{padding:28px;text-align:center;color:var(--mute);background:var(--panel);border-radius:14px}
.note{font-size:13px;color:var(--mute)}
.banner{background:color-mix(in srgb,var(--yel) 30%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.off{background:color-mix(in srgb,#ce1126 14%,transparent)}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.5);display:grid;place-items:center;padding:12px;z-index:9}
.dlg{background:var(--bg);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:14px;font-weight:600}
label>input,label>select,label>textarea{margin-top:4px;font-weight:400}
.full{grid-column:1/-1}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-weight:400}
.chk label{display:flex;gap:6px;align-items:center;font-weight:400}
.chk input{width:22px;min-height:22px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10;max-width:calc(100vw - 24px)}
.calc{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:14px}
.scroll{overflow-x:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;text-align:center;color:var(--ink);text-decoration:none;padding:4px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;min-height:28px;width:28px;padding:0;border-radius:99px;font-size:14px;z-index:1}
details{background:var(--panel);border-radius:10px;padding:8px 12px;margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px;min-height:28px}
.hist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.hist li{padding:6px 0;border-top:1px solid var(--line)}
.box{max-width:680px}
.sec{margin-top:28px}
#print{display:none}
.inv{max-width:720px;margin:0 auto;color:#111;font:11pt/1.5 Inter,Arial,sans-serif}
.inv h1{font-size:22pt;color:#00804f}.inv table{font-size:11pt}.inv td,.inv th{border-color:#ccc;color:#111}
.inv .flag{height:6px;background:linear-gradient(90deg,#ce1126 0 33.3%,#fcd116 0 66.6%,#009460 0);margin:10px 0 18px}
@media print{body>*:not(#print){display:none!important}#print{display:block}body{background:#fff}@page{margin:16mm}}
@media(max-width:900px){.board{grid-template-columns:repeat(5,minmax(220px,1fr));overflow-x:auto;scroll-snap-type:x mandatory}.colm{scroll-snap-align:start}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}.bars .b{grid-template-columns:6.5em minmax(0,1fr) auto}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.card,.kpi{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style><script src="demo.js"></script><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>
<body>
<header>
  <div class="brand"><div class="logo">224</div><div><h1>Tour de Guinée 224</h1><div class="sub">Gestion des reportages payants · Facebook &amp; TikTok</div></div></div>
  <nav id="nav" aria-label="Rubriques"></nav>
</header>
<main id="app"><div class="empty">Chargement…</div></main>
<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" id="dlg"></div></div>
<div id="print"></div>

<script>
{
const STATUTS=["Demande","Planifié","Tournage","Montage","Publié"];
const REGIONS=["Conakry","Boké","Kindia","Mamou","Labé","Faranah","Kankan","N'Zérékoré"];
const MOYENS=["Orange Money","MTN MoMo","Espèces","Transfert (WU, Ria…)","Autre"];
const PLATEFORMES=["Facebook","TikTok"];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const LABELS={tableau:"Tableau de bord",reportages:"Reportages",clients:"Clients",stats:"Statistiques",collaborateurs:"Collaborateurs",versements:"Versements",reglages:"Réglages"};
const VIEWS_ADM=["tableau","reportages","clients","stats","collaborateurs","versements","reglages"];
const VIEWS_COL=["tableau","reportages","versements","reglages"];
const S={rep:[],col:[],ver:[],cli:[],files:[],cfg:{taux:10000},stockage:null,ready:0,me:null,offline:false,cacheT:0};
const ADM=()=>S.me?.role==="admin";
const MYCOL=()=>S.me?.collab||"";
let view="tableau",F={q:"",st:"",co:"",pay:""},ST={an:null,m:"prix"},installEvt=null;

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number(v)||0;
// Montants saisis à la main : on accepte « 2 000 000 », « 2000000 », « 2.000.000 »… et on garde seulement les chiffres.
const pn=v=>Number(String(v??"").replace(/\D/g,""))||0;
const grp=v=>String(Math.round(Math.abs(num(v)))).replace(/\B(?=(\d{3})+(?!\d))/g," ");
// Pendant la frappe : sépare les milliers par des espaces sans déplacer le curseur.
function moneyInput(i){i.addEventListener("input",()=>{
  const pos=i.selectionStart??i.value.length,before=i.value.slice(0,pos).replace(/\D/g,"").length;
  const d=i.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"");i.value=d.replace(/\B(?=(\d{3})+(?!\d))/g," ");
  let p=0,c=0;while(p<i.value.length&&c<before){if(/\d/.test(i.value[p]))c++;p++}
  try{i.setSelectionRange(p,p)}catch(_){}})}
const gnf=v=>new Intl.NumberFormat("fr-FR").format(Math.round(num(v)))+" GNF";
const fmtE=x=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(x);
const tauxDe=r=>num(r?.taux)||num(S.cfg.taux)||1;           // taux du reportage, sinon taux actuel
const eur=(v,t)=>fmtE(num(v)/(num(t)||num(S.cfg.taux)||1));
const sumE=(L,f)=>L.reduce((a,r)=>a+num(f(r))/tauxDe(r),0);  // somme en euros, chaque reportage à son propre taux
const dt=d=>d?new Date(d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const dtt=s=>s?new Date(s).toLocaleString("fr-FR",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const newId=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");
const colName=id=>S.col.find(c=>c.id===id)?.nom||"—";
const cliOf=r=>S.cli.find(c=>c.id===r.clientId);
const cliNom=r=>cliOf(r)?.nom||r.client||"";
const cliTel=r=>cliOf(r)?.tel||r.contact||"";
const pay=r=>{const p=num(r.prix),e=num(r.encaisse);return p>0&&e>=p?["Payé","p-ok"]:e>0?["Avance","p-av"]:["Impayé","p-no"]};
const marge=r=>num(r.prix)-num(r.partCollab)-num(r.frais);
const byNom=(a,b)=>String(a.nom||"").localeCompare(String(b.nom||""),"fr");
const toast=m=>{const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)};
const KEY={reportages:"rep",collaborateurs:"col",versements:"ver",clients:"cli"};

function collabStats(id){
  const reps=S.rep.filter(r=>r.collab===id);
  const du=reps.reduce((a,r)=>a+num(r.partCollab)+num(r.frais),0);
  const verse=S.ver.filter(v=>v.collab===id).reduce((a,v)=>a+num(v.montant),0);
  return {n:reps.length,du,verse,reste:du-verse};
}

/* ---------- Affichage ---------- */
function render(){
  const views=ADM()?VIEWS_ADM:VIEWS_COL;
  $("#nav").innerHTML=S.me?views.map(v=>`<a href="#${v}"${v===view?' class="on" aria-current="page"':""}>${LABELS[v]}</a>`).join(""):"";
  if(!S.me)return;
  const app=$("#app");
  if(!S.ready){app.innerHTML=`<div class="empty">${esc(S.msg||"Chargement des données…")}</div>`;return}
  if(!views.includes(view))view="tableau";
  app.innerHTML=banners()+({tableau:vDash,reportages:vReps,clients:vClients,stats:vStats,collaborateurs:vCols,versements:vVers,reglages:vCfg}[view])();
  bind();
}
// Ne pas redessiner pendant une saisie (sinon le texte tapé serait perdu).
function renderSafe(){if($("#modal").hidden&&!document.activeElement?.matches?.("input,textarea,select"))render()}

function banners(){
  let h="";
  if(S.offline)h+=`<div class="banner off"><strong>Hors connexion.</strong> Vous voyez les données enregistrées sur ce téléphone${S.cacheT?" le "+dtt(new Date(S.cacheT).toISOString()):""}. Vos saisies seront envoyées dès que le réseau revient.</div>`;
  const n=Q.get().length;
  if(n)h+=`<div class="banner row"><span class="sp">${n} modification${n>1?"s":""} en attente d’envoi au serveur.</span><button id="flushNow">Envoyer maintenant</button></div>`;
  if(!ADM()&&!MYCOL())h+='<div class="banner">Votre compte n’est pas encore relié à votre fiche collaborateur : demandez à l’administrateur de le faire dans Réglages › Comptes d’accès.</div>';
  if(ADM()&&(S.rep.some(r=>r.exemple)||S.col.some(c=>c.exemple)))h+='<div class="banner row"><span class="sp">Les fiches marquées « exemple » montrent comment l’application fonctionne.</span><button id="clearEx">Supprimer les exemples</button></div>';
  return h;
}

const kM=(l,v,e,s="")=>`<div class="kpi"><span class="l">${l}</span><b>${gnf(v)}</b><small>≈ ${fmtE(e)} ${s}</small></div>`;
const kN=(l,n,s="")=>`<div class="kpi"><span class="l">${l}</span><b>${n}</b><small>${s}</small></div>`;

function board(L){
  return `<div class="board">${STATUTS.map(s=>{const C=L.filter(r=>(r.statut||"Demande")===s).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return `<div class="colm"><h4><span>${s}</span><span class="note">${C.length}</span></h4>${C.map(card).join("")||'<div class="note" style="padding:4px">Aucun</div>'}</div>`}).join("")}</div>`;
}
function vDash(){
  if(!ADM())return vDashCollab();
  const R=S.rep,tot=R.reduce((a,r)=>a+num(r.prix),0),enc=R.reduce((a,r)=>a+num(r.encaisse),0);
  const duC=S.col.reduce((a,c)=>a+Math.max(0,collabStats(c.id).reste),0);
  const mg=R.reduce((a,r)=>a+marge(r),0);
  const relance=R.filter(r=>pay(r)[0]!=="Payé"&&num(r.prix)>0);
  const fraisV=R.filter(r=>num(r.fraisDeclares)>0&&num(r.fraisDeclares)!==num(r.frais));
  return `<div class="row"><h2 class="sp">Où en sont les reportages</h2><button class="pri" data-new="rep">+ Nouveau reportage</button></div>
  <div class="kpis">${kM("Facturé aux clients",tot,sumE(R,r=>r.prix))}${kM("Encaissé",enc,sumE(R,r=>r.encaisse))}${kM("Reste à encaisser",tot-enc,sumE(R,r=>num(r.prix)-num(r.encaisse)),"· "+relance.length+" à relancer")}${kM("À verser aux collaborateurs",duC,duC/(num(S.cfg.taux)||1),"· marge "+gnf(mg))}</div>
  <h3>Tableau de production</h3>${board(R)}
  ${fraisV.length?`<h3>Frais déclarés à valider</h3><table class="stack"><thead><tr><th>Reportage</th><th>Collaborateur</th><th class="n">Déclarés</th><th class="n">Validés</th></tr></thead><tbody>${fraisV.map(r=>`<tr class="click" data-edit="rep:${esc(r.id)}"><td>${esc(r.titre)}</td><td>${esc(colName(r.collab))}</td><td class="n">${gnf(r.fraisDeclares)}</td><td class="n">${gnf(r.frais)}</td></tr>`).join("")}</tbody></table>`:""}
  <h3>À relancer (paiement client)</h3>
  ${relance.length?`<table class="stack"><thead><tr><th>Reportage</th><th>Client</th><th>Statut</th><th class="n">Reste dû</th></tr></thead><tbody>${relance.map(r=>`<tr class="click" data-edit="rep:${esc(r.id)}"><td>${esc(r.titre)}</td><td>${esc(cliNom(r))} ${cliTel(r)?`<span class="note">${esc(cliTel(r))}</span>`:""}</td><td>${esc(r.statut)}</td><td class="n">${gnf(num(r.prix)-num(r.encaisse))}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Tous les clients ont payé.</div>'}
  <h3>Par collaborateur</h3>${barsCollab()}`;
}
function vDashCollab(){
  const x=collabStats(MYCOL()),enCours=S.rep.filter(r=>r.statut!=="Publié").length,t=num(S.cfg.taux)||1;
  return `<div class="row"><h2 class="sp">Bonjour ${esc(S.me.nom)}</h2>${MYCOL()?'<button class="pri" data-new="rep">+ Nouveau reportage</button>':""}</div>
  <div class="kpis">${kN("Mes reportages",x.n,enCours+" en cours")}${kM("Ce qui m’est dû",x.du,x.du/t,"· rémunération + frais validés")}${kM("Déjà reçu",x.verse,x.verse/t)}${kM("Reste à recevoir",x.reste,x.reste/t)}</div>
  <h3>Mes reportages</h3>${board(S.rep)}`;
}
function card(r){
  const p=pay(r);
  return `<div class="card" tabindex="0" role="button" data-edit="rep:${esc(r.id)}"><strong>${esc(r.titre)}</strong><div class="m">${esc(r.village)}${r.region?" · "+esc(r.region):""}</div><div class="m">${ADM()?esc(colName(r.collab)):esc(cliNom(r))}${r.date?" · "+dt(r.date):""}</div><div class="row" style="margin-top:6px;gap:6px">${ADM()?`<span class="pill ${p[1]}">${p[0]}</span><span class="note">${gnf(r.prix)}</span>`:""}${r._pending?'<span class="pill p-wait">en attente d’envoi</span>':""}${r.exemple?'<span class="note">exemple</span>':''}</div></div>`;
}
function barsCollab(){
  if(!S.col.length)return '<div class="empty">Ajoutez vos collaborateurs dans l’onglet Collaborateurs.</div>';
  const st=S.col.slice().sort(byNom).map(c=>({c,...collabStats(c.id)})),mx=Math.max(1,...st.map(x=>Math.max(x.du,x.verse)));

/* Statistiques : barres horizontales à une seule série (une couleur), valeur écrite à côté, tableau disponible. */
const MESURES={prix:"Montant facturé",encaisse:"Montant encaissé",marge:"Marge",n:"Nombre de reportages"};
function chart(titre,rows,fmt,note=""){
  const mx=Math.max(1,...rows.map(r=>Math.max(0,r.v)));
  const vis=rows.filter(r=>r.v!==0||r.keep);
  if(!vis.length)return `<h3>${titre}</h3><div class="empty">Pas de données pour cette période.</div>`;
  return `<h3>${titre}</h3><div class="bars" role="list">${vis.map(r=>`<div class="b" role="listitem" title="${esc(r.l)} : ${esc(fmt(r.v))}"><span>${esc(r.l)}</span><div class="track"><i style="width:${Math.max(0,r.v)/mx*100}%;background:var(--grn)"></i></div><span class="v">${esc(fmt(r.v))}</span></div>`).join("")}</div>
  ${note?`<p class="note">${note}</p>`:""}<details><summary>Voir en tableau</summary><table><thead><tr><th>Libellé</th><th class="n">${MESURES[ST.m]}</th></tr></thead><tbody>${vis.map(r=>`<tr><td>${esc(r.l)}</td><td class="n">${esc(fmt(r.v))}</td></tr>`).join("")}</tbody></table></details>`;
}
function vStats(){
  const ans=[...new Set(S.rep.map(r=>(r.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
  if(ST.an===null)ST.an=ans[0]||"";
  const L=S.rep.filter(r=>!ST.an||(r.date||"").startsWith(ST.an));
  const val=r=>ST.m==="n"?1:ST.m==="marge"?marge(r):num(r[ST.m]);
  const fmt=ST.m==="n"?(v=>String(v)):gnf;
  const sum=f=>L.filter(f).reduce((a,r)=>a+val(r),0);
  const o=(a,v,s)=>`<option value="${esc(v)}" ${s===v?"selected":""}>${esc(a)}</option>`;
  const parTemps=ST.an
    ?MOIS.map((m,i)=>({l:m+" "+ST.an,v:sum(r=>+(r.date||"").slice(5,7)===i+1),keep:1}))
    :ans.slice().reverse().map(a=>({l:a,v:sum(r=>(r.date||"").startsWith(a)),keep:1}));
  const parRegion=[...REGIONS.map(g=>({l:g,v:sum(r=>r.region===g)})),{l:"Non renseignée",v:sum(r=>!r.region)}];
  const parPlat=[...PLATEFORMES.map(p=>({l:p,v:sum(r=>(r.plateformes||[]).includes(p))})),{l:"Pas encore publié",v:sum(r=>!(r.plateformes||[]).length)}];
  const parCol=S.col.slice().sort(byNom).map(c=>({l:c.nom,v:sum(r=>r.collab===c.id)})).sort((a,b)=>b.v-a.v);
  const cl=new Map();for(const r of L){const k=cliNom(r)||"Sans client";cl.set(k,(cl.get(k)||0)+val(r))}
  const parCli=[...cl].map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v).slice(0,10);
  const tot=L.reduce((a,r)=>a+num(r.prix),0),enc=L.reduce((a,r)=>a+num(r.encaisse),0),mg=L.reduce((a,r)=>a+marge(r),0);
  return `<div class="row"><h2 class="sp">Statistiques</h2>
  <select id="stAn" aria-label="Période" style="width:auto">${o("Toutes les années","",ST.an)}${ans.map(a=>o(a,a,ST.an)).join("")}</select>

  <div class="kpis">${kN("Reportages",L.length,ST.an?"en "+ST.an:"au total")}${kM("Facturé",tot,sumE(L,r=>r.prix))}${kM("Encaissé",enc,sumE(L,r=>r.encaisse))}${kM("Marge",mg,sumE(L,marge))}</div>
  ${chart(MESURES[ST.m]+(ST.an?" par mois":" par année"),parTemps,fmt)}
  ${chart(MESURES[ST.m]+" par région",parRegion,fmt)}
  ${chart(MESURES[ST.m]+" par plateforme",parPlat,fmt,"Un reportage publié sur Facebook et sur TikTok compte dans les deux lignes.")}
  ${chart(MESURES[ST.m]+" par collaborateur",parCol,fmt)}
  ${chart(MESURES[ST.m]+" : 10 premiers clients",parCli,fmt)}`;
}

const FIELD_LBL={};
const fmtV=(k,v)=>{if(v===null||v===undefined||v==="")return "—";if(["prix","encaisse","partCollab","frais","fraisDeclares","montant"].includes(k))return gnf(v);if(k==="collab")return colName(v);if(k==="clientId")return S.cli.find(c=>c.id===v)?.nom||"—";if(k==="date")return dt(v);return v};
const docName=(c,id)=>{const k=KEY[c],d=k&&S[k].find(x=>x.id===id);return d?(d.titre||d.nom||(d.montant?gnf(d.montant):id)):c==="comptes"?"compte "+id:c==="config"?"réglages":""};
function histHTML(L,withDoc){
  if(!L.length)return '<p class="note">Aucune modification enregistrée.</p>';
  return `<ul class="hist">${L.map(h=>`<li><strong>${dtt(h.quand)}</strong> · ${esc(h.nom||"compte supprimé")} · ${esc(h.action)}${withDoc&&docName(h.coll,h.docid)?" : "+esc(docName(h.coll,h.docid)):""}${h.champs&&Object.keys(h.champs).length?`<div class="note">${Object.entries(h.champs).map(([k,[a,b]])=>`${esc(FIELD_LBL[k]||k)} : ${esc(fmtV(k,a))} → ${esc(fmtV(k,b))}`).join(" ; ")}</div>`:""}</li>`).join("")}</ul>`;
}

function filesBox(coll,id,exists){
  const box=$("#fbox");if(!box)return;
  const L=S.files.filter(f=>f.coll===coll&&f.docid===id);
  const canAdd=exists&&(ADM()||(coll==="reportages"&&!!MYCOL()));

  box.innerHTML=`<span style="font-size:14px;font-weight:600">Photos et pièces jointes</span>
  <div class="thumbs">${L.map(f=>`<a class="thumb" href="${url(f)}" target="_blank" rel="noopener" title="${esc(f.nom)}">${f.mime.startsWith("image/")?`<img src="${url(f)}" loading="lazy" alt="${esc(f.nom)}">`:`<span>PDF<br>${esc(f.nom.slice(0,22))}</span>`}${ADM()||f.par===S.me.id?`<button type="button" data-fdel="${esc(f.id)}" aria-label="Supprimer ${esc(f.nom)}">✕</button>`:""}</a>`).join("")||'<span class="note">Aucune pour l’instant.</span>'}</div>
  ${canAdd?`<label class="btn">+ Ajouter une photo ou un PDF<input type="file" id="upl" accept="image/*,application/pdf" multiple class="vh"></label><span class="note" id="uplst" style="margin-inline-start:8px"></span>`
    :exists?"":`<p class="note" style="margin:0">Enregistrez d’abord la fiche${isPending(coll,id)?" (elle doit être envoyée au serveur)":""}, puis rouvrez-la pour ajouter des photos : reçus de frais, captures Orange Money…</p>`}`;
  box.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();
    if(!b.dataset.c){b.dataset.c=1;b.textContent="?";b.setAttribute("aria-label","Confirmer la suppression");toast("Touchez encore pour confirmer la suppression");return}
    try{await api("file_del",{body:{id:b.dataset.fdel}});S.files=S.files.filter(f=>f.id!==b.dataset.fdel);filesBox(coll,id,exists)}catch(x){err(x)}});
  const up=$("#upl");if(up)up.onchange=async()=>{
    const st=$("#uplst"),list=[...up.files];
    for(const [i,file] of list.entries()){
      st.textContent=`Envoi ${i+1}/${list.length}…`;
      try{const b=await shrink(file),fd=new FormData();fd.append("coll",coll);fd.append("docid",id);
        fd.append("file",b,b===file?file.name:(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg");
        const {file:m}=await api("upload",{form:fd});S.files.push(m)}
      catch(x){toast(x.offline?"Pas de réseau : les photos ne peuvent être envoyées qu’avec une connexion.":x.message);break}
    }
    filesBox(coll,id,exists)};
}
// Réduit les photos (1600 px, JPEG) pour économiser les données mobiles et l'espace du serveur.
async function shrink(file){
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)||(file.type==="image/jpeg"&&file.size<350000))return file;
  try{const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b&&b.size<file.size?b:file}catch(_){return file}
}

/* ---------- Exports ---------- */
function dlCSV(name,head,rows){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const t="﻿"+[head.map(q).join(";"),...rows.map(r=>r.map(q).join(";"))].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Fichier CSV téléchargé (s’ouvre dans Excel ou Google Sheets)");
}

    await sync();toast(`${nc} fiche(s) client créée(s), ${nr} reportage(s) relié(s)`)};
  if($("#clearEx"))$("#clearEx").onclick=async e=>{const b=e.target;if(!confirmBtn(b,"Confirmer : supprimer les exemples"))return;
    b.disabled=true;for(const [k,c] of Object.entries(COLL))for(const x of S[k].filter(x=>x.exemple))try{await api("del",{body:{coll:c,id:x.id}})}catch(z){err(z);return}toast("Exemples supprimés");sync()};
}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
const route=()=>{view=location.hash.slice(1)||"tableau";if(!LABELS[view])view="tableau";render()};
addEventListener("hashchange",route);

/* ---------- Serveur, file d'attente hors connexion, cache ---------- */
async function api(a,{body,q,form}={}){
  if(window.TDG_DEMO){ // mode démo : serveur simulé dans le navigateur (demo.js)
    const r=await TDG_DEMO(a,{body,q,form});
    if(r.offline){const e=new Error("Pas de connexion internet");e.offline=true;throw e}
    if(r.status>=400){const e=new Error(r.json.error||"Erreur");e.status=r.status;throw e}
    return r.json;
  }
  const url="api.php?a="+a+(q?"&"+new URLSearchParams(q):"");
  const opt={credentials:"same-origin",headers:{}};
  if(body||form){opt.method="POST";opt.headers["X-TDG"]="1";if(form)opt.body=form;else{opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}}
  let r;try{r=await fetch(url,opt)}catch(_){const e=new Error("Pas de connexion internet");e.offline=true;throw e}
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok){const e=new Error(j.error||"Erreur du serveur ("+r.status+")");e.status=r.status;throw e}
  return j;
}
// File des enregistrements à envoyer, gardée dans le téléphone (localStorage) tant que le serveur ne les a pas reçus.
const Q={k:()=>"tdg_q_"+(S.me?.id||0),get(){try{return JSON.parse(localStorage.getItem(this.k())||"[]")}catch(_){return []}},set(v){try{localStorage.setItem(this.k(),JSON.stringify(v))}catch(_){toast("Mémoire du téléphone pleine")}}};
const isPending=(coll,id)=>Q.get().some(x=>x.coll===coll&&x.id===id);
function applyLocal(coll,id,data){
  if(coll==="config"){S.cfg={...S.cfg,...data};return}
  const k=KEY[coll];if(!k)return;
  const i=S[k].findIndex(x=>x.id===id),m={...(i>=0?S[k][i]:{}),...data,id,_pending:1};
  if(i>=0)S[k][i]=m;else S[k].push(m);
}
function enqueue(coll,id,data,label){const u=newId(),q=Q.get();q.push({u,coll,id,data,label:label||"",t:Date.now()});Q.set(q);applyLocal(coll,id,data);return u}
let flushP=null;
function flush(){
  if(flushP)return flushP;
  const p=(async()=>{
    for(let q=Q.get();q.length;q=Q.get()){
      const it=q[0];
      try{await api("save",{body:{coll:it.coll,id:it.id,data:it.data}});S.offline=false}
      catch(e){if(e.offline){S.offline=true;break}if(e.status===401||e.status===429||e.status>=500)break;
        // Refus définitif du serveur (droits, données invalides) : on retire l'envoi et on prévient.
        toast(`Non enregistré${it.label?" (« "+it.label+" »)":""} : ${e.message}`)}
      Q.set(Q.get().filter(x=>x.u!==it.u));
    }
  })();
  flushP=p;p.finally(()=>{if(flushP===p)flushP=null});
  return p;
}
async function saveDoc(coll,id,data,label){
  const u=enqueue(coll,id,data,label);
  for(let i=0;i<2&&Q.get().some(x=>x.u===u)&&!S.offline;i++)await flush();
  const ok=!Q.get().some(x=>x.u===u);
  sync();return ok;
}
function overlayQueue(){for(const it of Q.get())applyLocal(it.coll,it.id,it.data)}
function applyData(j){
  const D=j.data;S.me=j.me;S.rep=D.reportages||[];S.col=D.collaborateurs||[];S.ver=D.versements||[];S.cli=D.clients||[];S.files=j.files||[];S.stockage=j.stockage||null;
  const c=(D.config||[]).find(x=>x.id==="main");S.cfg={taux:10000,...(c||{})};S.ready=1;
}
function cacheSave(j){try{localStorage.setItem("tdg_cache_"+j.me.id,JSON.stringify({j,t:Date.now()}));localStorage.setItem("tdg_last",String(j.me.id))}catch(_){}}
function fromCache(){try{const id=localStorage.getItem("tdg_last"),c=id&&JSON.parse(localStorage.getItem("tdg_cache_"+id)||"null");if(!c)return false;applyData(c.j);S.cacheT=c.t;return true}catch(_){return false}}
let busy=0,again=0;
async function sync(){
  if(busy){again=1;return}busy=1;
  try{await flush();const j=await api("all");applyData(j);cacheSave(j);S.offline=false;S.cacheT=0}
  catch(e){if(e.status===401){busy=0;return boot()}
    if(e.offline){S.offline=true;if(!S.ready&&!fromCache())S.msg="Pas de connexion internet et aucune donnée enregistrée sur ce téléphone."}
    else if(!S.ready)S.msg="Erreur du serveur : "+e.message}
  finally{busy=0}
  overlayQueue();renderSafe();
  if(again){again=0;sync()}
}
function authForm(setup){
  $("#app").innerHTML=`<div style="max-width:420px;margin:30px auto"><h2>${setup?"Première installation":"Connexion"}</h2>
  ${setup?'<p class="note">Créez le compte administrateur. Le code d’installation est celui que vous avez mis dans config.php.</p>':''}
  <form id="auth" class="grid2" style="grid-template-columns:minmax(0,1fr)">
  ${setup?'<label>Code d’installation<input name="code" required autocomplete="off"></label><label>Votre nom<input name="nom" required></label>':''}
  <label>Identifiant<input name="login" required autocomplete="username" autocapitalize="none"></label>
  <label>Mot de passe<input name="password" type="password" required ${setup?'minlength="8" autocomplete="new-password"':'autocomplete="current-password"'}></label>
  <button class="pri">${setup?"Créer le compte":"Se connecter"}</button><p id="aerr" class="note" role="alert" style="color:var(--rouge)"></p></form></div>`;
  $("#auth").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=e.target.querySelector("button");b.disabled=true;
    try{const r=await api(setup?"setup":"login",{body:f});S.me=r.me;render();await sync()}catch(x){b.disabled=false;$("#aerr").textContent=x.message}};
}
async function boot(){
  S.ready=0;S.msg="";
  try{const s=await api("status");
    if(s.me){S.me=s.me;render();sync()}else{S.me=null;render();authForm(s.setup)}}
  catch(e){
    if(e.offline&&fromCache()){S.offline=true;overlayQueue();render()}
    else $("#app").innerHTML=`<div class="empty">${e.offline?"Pas de connexion internet. Ouvrez l’application une première fois avec du réseau.":"Serveur injoignable : vérifiez que api.php est bien en ligne et que PHP est activé."}</div>`}
}
setInterval(()=>{if(S.me&&!document.hidden)S.offline&&!S.ready?boot():sync()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.me)sync()});
addEventListener("online",()=>{if(S.me)sync();else boot()});
addEventListener("offline",()=>{S.offline=true;renderSafe()});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(view==="reglages")renderSafe()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
route();boot();
}
</script>
